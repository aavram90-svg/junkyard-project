    <!DOCTYPE html>
    <html lang="en">
    <head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Clicker Counter</title>

    <style>
        body {
           
            font-family: Arial, sans-serif;
           
            text-align: center;
            
            background-color: #222;
            
            color: white;
           
            padding-top: 100px; }

        h1 {
            
            font-size: 40px; }

        #counter {
            
            font-size: 70px;
           
            margin: 30px;
         
            color: #fcfcfc; }

            button {
            
            font-size: 25px;
           
            padding: 15px 40px;
           
            border: 20px;
           
            border-radius: 15px;
            
            background-color: #0c0c0c;
            
            color: white;
            
            cursor: pointer;}

        button:hover {
            background-color: #ffffff;}

        #reset {
            background-color: #000000;
            margin-left: 15px;}

        #reset:hover {
            background-color: #000000;}
    </style>
    </head>

    <body>

    <h1>Clicker Counter</h1>

    <div id="counter"> 0 </div>

    <button onclick="addClick()"> Click </button>

    <button id="reset" onclick="resetCounter()">Reset</button>

    <script>

        let count = 0;

        function addClick()
         {
            count++;
            
            document.getElementById("counter").textContent = count; }

        function resetCounter()
         {
            count = 0;
            
            document.getElementById("counter").textContent = count;}

    </script>

    </body>
    </html>
